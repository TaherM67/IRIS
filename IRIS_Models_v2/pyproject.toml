[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-advisory-models"
version = "1.1.0"
description = "IRIS grouped-holdout scenario classification and control recommendation"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0", "scikit-learn==1.8.0", "joblib==1.5.3", "threadpoolctl==3.6.0"]

[project.scripts]
iris-models = "iris_models.__main__:main"

[tool.setuptools.packages.find]
include = ["iris_models*"]

[tool.setuptools.package-data]
iris_models = ["data/*.csv"]
